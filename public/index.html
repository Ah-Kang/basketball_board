<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>바스켓 · 농구 일정 찾기</title><link rel="stylesheet" href="/styles.css"></head>
<body data-mobile-tab="home">
<section id="loginScreen" class="login-screen" aria-labelledby="loginTitle">
  <div class="app-mark" aria-hidden="true">b</div><p class="eyebrow">함께하는 농구</p><h1 id="loginTitle">바스켓에 로그인</h1><p class="login-description" id="loginDescription">이메일 계정으로 로그인해 주세요.</p>
  <form id="loginForm"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button type="submit" id="loginSubmit">로그인</button></form>
  <p id="loginMessage" role="status">로그인 상태를 확인하고 있어요.</p>
  <button id="signupToggle" class="auth-toggle" type="button" hidden>처음 오셨나요? 회원가입</button>
</section>
<div id="app" hidden>
<header class="topbar"><a class="brand-block" href="/" aria-label="바스켓 홈"><span class="app-mark" aria-hidden="true">b</span><h1>바스켓</h1></a><div class="account-controls"><p id="syncStatus" class="sync-status" role="status">일정 불러오는 중</p><button id="logoutButton" class="reset-button" type="button" hidden>로그아웃</button></div></header>
<main>
<section class="home-intro"><p class="eyebrow" id="todayLabel"></p><h2>오늘, 어디서<br>농구할까요?</h2><button class="welcome-banner" type="button" id="browseSchedule"><span><strong>나에게 맞는 한 게임</strong><span>원하는 날짜의 경기를 찾아보세요</span></span><span class="banner-arrow" aria-hidden="true">↗</span></button></section>
<section class="calendar-panel" aria-labelledby="calendarTitle">
<div class="schedule-heading"><div><p class="eyebrow">함께 뛰는 날</p><h2 id="calendarTitle">언제 뛰고 싶으세요?</h2></div><button id="goToday" class="quiet-button" type="button">오늘</button></div>
<div class="month-controls" aria-label="날짜 이동"><strong id="monthLabel"></strong><div><button id="prevMonth" type="button" aria-label="이전 주">‹</button><button id="nextMonth" type="button" aria-label="다음 주">›</button></div></div>
<div id="datePicker"><div class="weekday-row" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar-grid" aria-label="일정 날짜 선택"></div></div>
<button id="calendarToggle" class="calendar-toggle" type="button" aria-expanded="false" aria-controls="datePicker">월간 달력 펼치기 <span aria-hidden="true">⌄</span></button>
</section>
<section class="filters" aria-label="경기 필터"><div class="type-tabs" aria-label="경기 종류"><button type="button" data-type="all" aria-pressed="true">전체</button><button type="button" data-type="pickup" aria-pressed="false">픽업</button><button type="button" data-type="practice" aria-pressed="false">연습게임</button><button type="button" data-type="rental" aria-pressed="false">대관</button></div>
<div class="filter-row"><label class="select-pill"><span class="sr-only">지역</span><select id="provinceFilter" aria-label="지역"><option value="all">지역 전체</option></select></label><label class="select-pill"><span class="sr-only">시·구</span><select id="cityFilter" aria-label="시·구"><option value="all">시·구 전체</option></select></label><label class="check-pill"><input id="openOnly" type="checkbox" checked><span>모집 중만</span></label><button id="resetFilters" class="reset-button" type="button" aria-label="필터 초기화">초기화</button></div></section>
<section class="selected-day" aria-labelledby="selectedTitle"><div class="list-header"><div><h2 id="selectedTitle">참여할 수 있는 경기</h2><p id="selectedDate" class="selected-date"></p></div><span id="resultCount" class="result-count" aria-live="polite"></span></div><div id="eventList" class="event-list" aria-live="polite"></div></section>
</main>
<nav class="mobile-tabs" aria-label="주요 메뉴"><button class="is-active" type="button" data-mobile-tab="home" aria-pressed="true"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10.5V20h11v-9.5M10 20v-5h4v5"/></svg><span>홈</span></button><button type="button" data-mobile-tab="events" aria-pressed="false"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v3M17 4v3M5 11h14"/><rect x="4.5" y="6" width="15" height="14" rx="3"/><path d="M8 15h.01M12 15h.01M16 15h.01"/></svg><span>일정</span></button></nav>
<dialog id="eventDialog" class="event-dialog"><div class="dialog-shell"><button id="dialogClose" class="dialog-close" type="button" aria-label="닫기">×</button><div id="dialogContent"></div></div></dialog>
</div><script src="/app.js" type="module"></script></body></html>
