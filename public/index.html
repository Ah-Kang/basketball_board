<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1f2f4">
  <title>농구 픽업 캘린더</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand-block">
      <div class="app-mark" aria-hidden="true">B</div>
      <div>
        <p class="eyebrow">Basketball Board</p>
        <h1>농구 픽업 캘린더</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <p id="syncStatus" class="sync-status">일정 데이터를 불러오는 중</p>
      <div class="month-controls" aria-label="월 이동">
        <button id="prevMonth" type="button" aria-label="이전 달">‹</button>
        <strong id="monthLabel"></strong>
        <button id="nextMonth" type="button" aria-label="다음 달">›</button>
      </div>
    </div>
  </header>

  <section class="stats-row" aria-label="요약">
    <div class="stat">
      <span>전체 일정</span>
      <strong id="totalCount">0</strong>
    </div>
    <div class="stat">
      <span>오늘</span>
      <strong id="todayCount">0</strong>
    </div>
    <div class="stat">
      <span>모집중</span>
      <strong id="openCount">0</strong>
    </div>
  </section>

  <main class="layout">
    <section class="calendar-panel" aria-labelledby="calendarTitle">
      <div class="panel-header">
        <h2 id="calendarTitle">월간 일정</h2>
        <div class="legend" aria-label="일정 종류">
          <span><i class="dot pickup"></i>픽업</span>
          <span><i class="dot practice"></i>연습게임</span>
          <span><i class="dot rental"></i>대관</span>
        </div>
      </div>
      <div class="weekday-row" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendar" class="calendar-grid" aria-live="polite"></div>
    </section>

    <aside class="side-panel">
      <section class="filters" aria-label="필터">
        <label>
          지역
          <select id="areaFilter">
            <option value="all">전체</option>
          </select>
        </label>
        <label>
          종류
          <select id="typeFilter">
            <option value="all">전체</option>
            <option value="pickup">픽업</option>
            <option value="practice">연습게임</option>
            <option value="rental">대관</option>
          </select>
        </label>
        <label class="checkbox">
          <input id="openOnly" type="checkbox" checked>
          모집중만
        </label>
      </section>

      <section class="selected-day" aria-labelledby="selectedTitle">
        <div class="list-header">
          <div>
            <h2 id="selectedTitle">선택한 날짜</h2>
            <p id="selectedDate" class="selected-date"></p>
          </div>
          <div class="day-switch" aria-label="일정 보기 방식">
            <button class="is-active" type="button" data-day-mode="selected">선택 날짜</button>
            <button type="button" data-day-mode="today">오늘</button>
          </div>
        </div>
        <div id="eventList" class="event-list"></div>
      </section>
    </aside>
  </main>

  <nav class="mobile-tabs" aria-label="하단 탭">
    <button class="is-active" type="button" data-mobile-tab="home">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 11.5 12 5l8 6.5" />
        <path d="M6.5 10.5V20h11v-9.5" />
        <path class="tab-accent" d="M10 20v-5h4v5" />
      </svg>
      <b>홈</b>
    </button>
    <button type="button" data-mobile-tab="events">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 4v3M17 4v3" />
        <rect x="4.5" y="6" width="15" height="14" rx="3" />
        <path d="M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01" />
        <path class="tab-accent" d="M16 15h.01" />
      </svg>
      <b>일정</b>
    </button>
    <button type="button" data-mobile-tab="filters">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 7h14M5 12h14M5 17h14" />
        <circle cx="9" cy="7" r="2" />
        <circle class="tab-accent" cx="15" cy="12" r="2" />
        <circle cx="11" cy="17" r="2" />
      </svg>
      <b>필터</b>
    </button>
  </nav>

  <dialog id="eventDialog" class="event-dialog">
    <div class="dialog-shell">
      <button id="dialogClose" class="dialog-close" type="button" aria-label="닫기">×</button>
      <div id="dialogContent"></div>
    </div>
  </dialog>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
